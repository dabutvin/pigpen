name: PR Screenshots

on:
  pull_request:
    branches: [main]

concurrency:
  group: screenshots-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Capture App Screenshots
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Pigpen.xcodeproj \
            -scheme Pigpen

      - name: Pick simulator
        run: |
          set -euo pipefail
          AVAILABLE=$(xcrun simctl list devices available)
          DEVICE=""
          for name in "iPhone 17 Pro" "iPhone 17" "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15"; do
            if grep -q "^ *$name (" <<< "$AVAILABLE"; then DEVICE="$name"; break; fi
          done
          if [ -z "$DEVICE" ]; then
            DEVICE=$(grep -oE '^ *iPhone[^(]*' <<< "$AVAILABLE" | head -1 | xargs || true)
          fi
          if [ -z "$DEVICE" ]; then
            echo "ERROR: No iPhone simulator available"
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ env.DEVICE }},OS=latest" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: Capture screenshots
        run: |
          set -euo pipefail
          mkdir -p screenshots

          DEVICE="${{ env.DEVICE }}"

          # Boot the simulator
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          sleep 5

          # Clean status bar: 9:41, full signal, full wifi, full battery
          xcrun simctl status_bar "$DEVICE" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4

          # Find and install the built app
          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find built .app bundle"
            exit 1
          fi
          echo "Installing: $APP_PATH"
          xcrun simctl install "$DEVICE" "$APP_PATH"

          BUNDLE_ID="com.pigpen.app"

          # Each screen is shot in both appearances. `-puzzle` is a launch argument the
          # app understands, so the board can be captured without tapping through.
          capture() {
            local file="$1"
            local appearance="$2"
            shift 2

            xcrun simctl ui "$DEVICE" appearance "$appearance"
            sleep 1
            xcrun simctl launch "$DEVICE" "$BUNDLE_ID" "$@"
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "screenshots/$file"
            echo "Captured: $file"
            xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
          }

          capture 01_title_light.png light
          capture 02_title_dark.png dark
          capture 03_puzzle_light.png light -puzzle
          capture 04_puzzle_dark.png dark -puzzle

          # Clean up status bar override
          xcrun simctl status_bar "$DEVICE" clear

          echo "All screenshots captured:"
          ls -la screenshots/

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-pr-${{ github.event.pull_request.number }}
          path: screenshots/
          retention-days: 30

      - name: Post screenshots to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'ci-screenshots';
            const screenshotsDir = 'screenshots';

            // Ensure the ci-screenshots branch exists
            async function ensureBranch() {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch });
              } catch (e) {
                if (e.status === 404) {
                  const defaultBranch = await github.rest.repos.getBranch({
                    owner, repo, branch: 'main'
                  });
                  await github.rest.git.createRef({
                    owner, repo,
                    ref: `refs/heads/${branch}`,
                    sha: defaultBranch.data.commit.sha
                  });
                  core.info(`Created branch: ${branch}`);
                } else {
                  throw e;
                }
              }
            }

            async function uploadFile(filePath, targetPath) {
              const content = fs.readFileSync(filePath);
              const base64 = content.toString('base64');

              let sha;
              try {
                const existing = await github.rest.repos.getContent({
                  owner, repo, path: targetPath, ref: branch
                });
                sha = existing.data.sha;
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              const params = {
                owner, repo,
                path: targetPath,
                message: `Update screenshot for PR #${prNumber}`,
                content: base64,
                branch
              };
              if (sha) params.sha = sha;

              await github.rest.repos.createOrUpdateFileContents(params);
              const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${targetPath}`;
              return rawUrl;
            }

            await ensureBranch();

            const files = fs.readdirSync(screenshotsDir)
              .filter(f => f.endsWith('.png'))
              .sort();

            const images = [];
            for (const file of files) {
              const filePath = path.join(screenshotsDir, file);
              const targetPath = `pr-${prNumber}/${file}`;
              core.info(`Uploading ${file}...`);
              const url = await uploadFile(filePath, targetPath);
              images.push({ name: file, url });
            }

            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const cacheBust = Date.now();

            let body = `## 📱 App Screenshots\n\n`;
            body += `> Automatically captured from commit \`${commitSha}\` on **${context.payload.pull_request.head.ref}**\n\n`;

            // Screenshots are named <order>_<screen>_<appearance>.png, so each screen
            // gets its own light/dark row.
            const screens = [];
            const loose = [];
            for (const img of images) {
              const match = img.name.match(/^\d+_(.+)_(light|dark)\.png$/);
              if (!match) { loose.push(img); continue; }
              const [, name, appearance] = match;
              let screen = screens.find(s => s.name === name);
              if (!screen) { screen = { name }; screens.push(screen); }
              screen[appearance] = img.url;
            }

            const cell = (url) => url ? `<img src="${url}?v=${cacheBust}" width="300" />` : '—';

            for (const screen of screens) {
              const label = screen.name.replace(/_/g, ' ');
              body += `### ${label.charAt(0).toUpperCase()}${label.slice(1)}\n\n`;
              body += `| Light Mode | Dark Mode |\n`;
              body += `|:---:|:---:|\n`;
              body += `| ${cell(screen.light)} | ${cell(screen.dark)} |\n\n`;
            }

            for (const img of loose) {
              body += `### ${img.name.replace('.png', '').replace(/_/g, ' ')}\n`;
              body += `<img src="${img.url}?v=${cacheBust}" width="350" />\n\n`;
            }

            body += `\n<sub>📦 Full-resolution screenshots available in the <a href="${context.payload.pull_request.html_url}/checks">workflow artifacts</a>.</sub>\n`;
            body += `\n<!-- pr-screenshots-bot -->`;

            // Find existing bot comment to update, or create a new one
            const watermark = '<!-- pr-screenshots-bot -->';
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });

            const existing = comments.data.find(c => c.body && c.body.includes(watermark));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated existing comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body
              });
              core.info('Created new PR comment with screenshots');
            }
