name: PR Screenshots

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # A hand crank, for when the run a pull request should have started never
  # arrives — a runner shortage, a cancelled queue, an Actions hiccup. Give it
  # the pull request number and it posts the shots to that one as usual.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to post the screenshots to
        required: true

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Capture App Screenshots
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The destination is generic so that nothing here has to wait on a
      # simulator, and `ARCHS` keeps a generic destination from compiling every
      # architecture the simulator platform has.
      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            ARCHS="$(uname -m)" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      # After the build rather than beside it: booting takes every core a runner
      # has, and sharing them made the build four times slower for no gain.
      - name: Wake up the iPhone simulator
        id: simulator
        uses: ./.github/actions/simulator

      - name: Capture iPhone screenshots
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p screenshots

          BUNDLE_ID="com.pigpen.app"

          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find built .app bundle"
            exit 1
          fi
          echo "Installing: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

          # Each screen is shot in both appearances off a single launch: the views
          # read the colour scheme out of the environment, so flipping the
          # simulator under a running app re-draws it, and the two shots then show
          # the same board rather than two rolls of the dice. `-universe`, `-map`,
          # `-woods-map`, `-woods-rationed`, `-peak-map`, `-city-map`, `-puzzle`, `-beaten`,
          # `-orchard`, `-sour`, `-boss`, `-truffles`, `-embers`, `-pies`, `-tutorial`, `-daily`,
          # `-archive`, `-title`, `-title-fresh`, `-settings`, `-reminder`, `-toll`, `-barn-map`,
          # `-barn`, `-woods-barn-map`, `-woods-barn`, `-dressed-board`, `-dressed-title`,
          # `-postcard`, `-record` and
          # `-peak-record` are launch arguments the app understands, so the universe map,
          # every world's trail, the boards, the practice pen, the daily puzzle and its
          # archive, the settings sheet, the offer of a daily reminder, the card over a
          # shut boss, the fork off the orchard, the dressing barn at the end of it, what
          # the landmark at the foot of a trail keeps, and a chosen
          # hat still on her on a board and out in the pasture can be captured without
          # tapping through the title screen. The reminder screens are handed a
          # reminder held in memory, so nothing on the runner is ever asked for
          # permission to post a notification.
          # The daily screens open on a fixed square of the calendar with a stopped
          # clock, since a running one photographs as whenever the runner got round to it.
          # A screen photographed before it has finished painting comes back as an
          # empty white room, and a white room is almost nothing to compress: the
          # blank ones weigh well under a hundred kilobytes where the thinnest real
          # screen weighs nine hundred. So every shot is weighed, and a light one is
          # taken again after a longer wait rather than published as the truth.
          shoot() {
            local into="$1"
            local attempt
            for attempt in 1 2 3; do
              xcrun simctl io "$UDID" screenshot "$into"
              if [ "$(stat -f%z "$into" 2>/dev/null || echo 0)" -ge 400000 ]; then
                return 0
              fi
              echo "Shot $into came back empty on attempt $attempt; giving it longer."
              sleep 4
            done
            echo "::warning::$into still looks blank after three attempts."
          }

          capture() {
            local order="$1"
            local screen="$2"
            shift 2

            local light dark
            light=$(printf 'screenshots/%02d_%s_light.png' "$order" "$screen")
            dark=$(printf 'screenshots/%02d_%s_dark.png' "$((order + 1))" "$screen")

            xcrun simctl ui "$UDID" appearance light
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@"
            sleep 6
            shoot "$light"

            xcrun simctl ui "$UDID" appearance dark
            sleep 2
            shoot "$dark"

            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            echo "Captured: $light, $dark"
          }

          capture 1 title -title-fresh
          capture 3 tutorial -tutorial
          capture 5 universe -universe
          capture 7 map -map
          capture 9 woods_map -woods-map
          capture 11 peak_map -peak-map
          capture 13 city_map -city-map
          capture 15 puzzle -puzzle
          capture 17 beaten -beaten
          capture 19 orchard -orchard
          capture 21 sour -sour
          capture 23 boss -boss
          capture 25 truffles -truffles
          capture 27 embers -embers
          capture 29 pies -pies
          capture 31 settings -settings
          capture 33 daily -daily
          capture 35 archive -archive
          capture 37 reminder -reminder
          capture 39 title_held -title

          # The universe map as a player sees it before they pay: every world past the
          # free meadow for sale, in colour under a gold lock. Numbered high so it sits
          # at the end of the gallery rather than renumbering every shot above it.
          capture 69 universe_locked -universe-locked

          # The word the map gives a player who has run the trail out and cannot pay the
          # boss's price. Numbered high for the same reason as the shot above it.
          capture 71 toll -toll

          # The card a held day is sent as, held up the way it is held up before it goes —
          # the one screen in the game that is also a picture somebody else receives, so it
          # is worth looking at every time it changes. Numbered past the tablet's shots so
          # nothing already in the gallery moves.
          capture 99 postcard -postcard

          # The thicket's trail as a player who has not paid finds it the day after their
          # first free level there: the next stop under a lock, with the rest of the free
          # game's day counted down over it. Numbered high for the same reason.
          capture 81 woods_rationed -woods-rationed

          # The fork off the orchard — the one branch on any trail in the game — and the
          # dressing barn at the end of it, with something already on the pig. Then the two
          # that prove an outfit is not only worn in the barn: a board and the title screen,
          # both opened on a pig who has been dressed. Numbered high for the same reason the
          # shots above are, so nothing already in the gallery shifts.
          capture 73 barn_map -barn-map
          capture 75 barn -barn
          capture 77 dressed_board -dressed-board
          capture 79 dressed_title -dressed-title

          # The thicket's fork and the woodland barn at the end of it — the second door in
          # the game — with a hat on the pig as well as company, since what the shot has to
          # show is that the two barns compose. Numbered past the record shots.
          capture 105 woods_barn_map -woods-barn-map
          capture 107 woods_barn -woods-barn

          # What the landmark at the foot of a trail has been keeping count of. Two shots,
          # because the panel has two quite different things to be: the meadow, which enough
          # people have played for it to say how a player compares, and the mountain, which
          # almost nobody has climbed and which therefore shows a record and nothing beside it.
          # The second is the common case and will be for years. Numbered past the postcard,
          # which took 99 and 100 while this branch was open.
          capture 101 record -record
          capture 103 peak_record -peak-record

          # The cut scenes are not photographed here. There are a hundred and fourteen
          # shots across the game's thirty-six films, every one of them stopped on a clock
          # that does not move, and a gallery that size is a worse way to look at them than
          # opening the film in a preview or in the projection room behind the gear. The
          # launch arguments that stop each shot are still there — `PigpenApp.stills` — for
          # anyone who wants to photograph one.

          xcrun simctl status_bar "$UDID" clear
          # Put away before the tablet is woken, so the two are never sharing the
          # runner's cores.
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

          echo "Phone screenshots captured:"
          ls -la screenshots/

      # The same screens again on a tablet, for the handful whose layout is not the
      # phone's stretched: the board and the lists keep to a phone's width in the
      # middle of the glass, and the trails wind up the middle of their maps. A
      # tablet on its side lays the board beside its furniture, but the simulator
      # cannot be turned on its side from the command line, so that layout is the
      # one thing here that has to be looked at by hand.
      - name: Wake up the iPad simulator
        id: ipad
        uses: ./.github/actions/simulator
        with:
          family: iPad

      - name: Capture iPad screenshots
        env:
          UDID: ${{ steps.ipad.outputs.udid }}
        run: |
          set -euo pipefail

          BUNDLE_ID="com.pigpen.app"
          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          xcrun simctl install "$UDID" "$APP_PATH"

          # The same weighing the phone's shots get: a screen caught mid-paint is a
          # white room, and a white room weighs nothing.
          shoot() {
            local into="$1"
            local attempt
            for attempt in 1 2 3; do
              xcrun simctl io "$UDID" screenshot "$into"
              if [ "$(stat -f%z "$into" 2>/dev/null || echo 0)" -ge 400000 ]; then
                return 0
              fi
              echo "Shot $into came back empty on attempt $attempt; giving it longer."
              sleep 4
            done
            echo "::warning::$into still looks blank after three attempts."
          }

          # The same two shots off one launch the phone gets, named `ipad_<screen>` so
          # the gallery files them under their own heading.
          capture() {
            local order="$1"
            local screen="$2"
            shift 2

            local light dark
            light=$(printf 'screenshots/%02d_ipad_%s_light.png' "$order" "$screen")
            dark=$(printf 'screenshots/%02d_ipad_%s_dark.png' "$((order + 1))" "$screen")

            xcrun simctl ui "$UDID" appearance light
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@"
            sleep 6
            shoot "$light"

            xcrun simctl ui "$UDID" appearance dark
            sleep 2
            shoot "$dark"

            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            echo "Captured: $light, $dark"
          }

          # Numbered past every phone shot, so the tablet's sit together at the end of
          # the gallery. The title is the dressed one: it opens on the same held game as
          # `-title` with the reminder's offer already made, so the shot is the pasture
          # and the run of boards rather than a sheet standing over both.
          capture 83 title -dressed-title
          capture 85 universe -universe
          capture 87 map -map
          capture 89 puzzle -puzzle
          capture 91 boss -boss
          capture 93 archive -archive
          capture 95 settings -settings
          capture 97 barn -barn

          xcrun simctl status_bar "$UDID" clear

          echo "All screenshots captured:"
          ls -la screenshots/

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-pr-${{ github.event.pull_request.number || inputs.pr }}
          path: screenshots/
          retention-days: 30

      - name: Post screenshots to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request?.number
              ?? Number(context.payload.inputs.pr);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'ci-screenshots';
            const screenshotsDir = 'screenshots';

            // Ensure the ci-screenshots branch exists
            async function ensureBranch() {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch });
              } catch (e) {
                if (e.status === 404) {
                  const defaultBranch = await github.rest.repos.getBranch({
                    owner, repo, branch: 'main'
                  });
                  await github.rest.git.createRef({
                    owner, repo,
                    ref: `refs/heads/${branch}`,
                    sha: defaultBranch.data.commit.sha
                  });
                  core.info(`Created branch: ${branch}`);
                } else {
                  throw e;
                }
              }
            }

            // Run `worker` over `items`, `limit` of them in flight at a time.
            async function inParallel(items, limit, worker) {
              const results = new Array(items.length);
              let next = 0;
              await Promise.all(
                Array.from({ length: Math.min(limit, items.length) }, async () => {
                  while (next < items.length) {
                    const i = next++;
                    results[i] = await worker(items[i], i);
                  }
                })
              );
              return results;
            }

            await ensureBranch();

            const files = fs.readdirSync(screenshotsDir)
              .filter(f => f.endsWith('.png'))
              .sort();

            // A blob apiece, several at a time, and then one commit holding all of
            // them. Writing the files one at a time through the contents API meant
            // forty-two round trips and forty-two commits, and it was a minute and
            // a half of the job; this is five seconds of it.
            const blobs = await inParallel(files, 8, async (file) => {
              const content = fs.readFileSync(path.join(screenshotsDir, file));
              const { data } = await github.rest.git.createBlob({
                owner, repo,
                content: content.toString('base64'),
                encoding: 'base64'
              });
              core.info(`Uploaded ${file}`);
              return {
                path: `pr-${prNumber}/${file}`,
                mode: '100644',
                type: 'blob',
                sha: data.sha
              };
            });

            // Every pull request writes to this one branch, so the commit is built
            // on whatever the tip is at the moment it lands. If somebody else's run
            // got there first, build it again on top of theirs rather than over it.
            async function commitShots() {
              const ref = await github.rest.git.getRef({
                owner, repo, ref: `heads/${branch}`
              });
              const parent = ref.data.object.sha;
              const parentCommit = await github.rest.git.getCommit({
                owner, repo, commit_sha: parent
              });
              const tree = await github.rest.git.createTree({
                owner, repo,
                base_tree: parentCommit.data.tree.sha,
                tree: blobs
              });
              const commit = await github.rest.git.createCommit({
                owner, repo,
                message: `Update screenshots for PR #${prNumber}`,
                tree: tree.data.sha,
                parents: [parent]
              });
              await github.rest.git.updateRef({
                owner, repo,
                ref: `heads/${branch}`,
                sha: commit.data.sha
              });
            }

            for (let attempt = 1; ; attempt++) {
              try {
                await commitShots();
                break;
              } catch (e) {
                if (e.status !== 422 || attempt === 5) throw e;
                core.info(`${branch} moved under us; trying again (${attempt})`);
              }
            }

            const images = files.map(file => ({
              name: file,
              url: `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/pr-${prNumber}/${file}`
            }));

            // A pull request event knows all of this; a hand-cranked run has to be told
            // the number and look the rest up.
            const pr = context.payload.pull_request
              ?? (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;

            const commitSha = pr.head.sha.substring(0, 7);
            const cacheBust = Date.now();

            let body = `## 📱 App Screenshots\n\n`;
            body += `> Automatically captured from commit \`${commitSha}\` on **${pr.head.ref}**\n\n`;

            // A screen the phone lights is named <order>_<screen>_<appearance>.png and
            // gets its own light/dark row. A cut scene is lit by the shot rather than by
            // the phone, so it is photographed once and named <order>_<screen>_scene.png,
            // and gets a single picture.
            const screens = [];
            const loose = [];
            const screenNamed = (name) => {
              let screen = screens.find(s => s.name === name);
              if (!screen) { screen = { name }; screens.push(screen); }
              return screen;
            };
            for (const img of images) {
              const pair = img.name.match(/^\d+_(.+)_(light|dark)\.png$/);
              if (pair) { screenNamed(pair[1])[pair[2]] = img.url; continue; }
              const scene = img.name.match(/^\d+_(.+)_scene\.png$/);
              if (scene) { screenNamed(scene[1]).scene = img.url; continue; }
              loose.push(img);
            }

            const shot = (url) => `<img src="${url}?v=${cacheBust}" width="300" />`;
            const cell = (url) => url ? shot(url) : '—';

            if (screens.some(s => s.scene)) {
              body += `> The cut scenes are lit by the shot rather than by the phone, so each is shown once.\n\n`;
            }

            // A tablet's shot is headed "iPad …" rather than "Ipad …".
            const heading = (name) => {
              const label = name.replace(/_/g, ' ');
              if (label.startsWith('ipad ')) return `iPad ${label.slice(5)}`;
              return `${label.charAt(0).toUpperCase()}${label.slice(1)}`;
            };

            for (const screen of screens) {
              body += `### ${heading(screen.name)}\n\n`;
              if (screen.scene) {
                body += `${shot(screen.scene)}\n\n`;
                continue;
              }
              body += `| Light Mode | Dark Mode |\n`;
              body += `|:---:|:---:|\n`;
              body += `| ${cell(screen.light)} | ${cell(screen.dark)} |\n\n`;
            }

            for (const img of loose) {
              body += `### ${img.name.replace('.png', '').replace(/_/g, ' ')}\n`;
              body += `<img src="${img.url}?v=${cacheBust}" width="350" />\n\n`;
            }

            body += `\n<sub>📦 Full-resolution screenshots available in the <a href="${pr.html_url}/checks">workflow artifacts</a>.</sub>\n`;
            body += `\n<!-- pr-screenshots-bot -->`;

            // Find existing bot comment to update, or create a new one
            const watermark = '<!-- pr-screenshots-bot -->';
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });

            const existing = comments.data.find(c => c.body && c.body.includes(watermark));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated existing comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body
              });
              core.info('Created new PR comment with screenshots');
            }
