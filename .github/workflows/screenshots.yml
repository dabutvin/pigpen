name: PR Screenshots

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: screenshots-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Capture App Screenshots
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      # Waking the simulator up takes several times as long as building the app,
      # so it starts here and happens while the build does, rather than after it.
      # Homebrew goes first only because a download racing the boot for the
      # machine makes both of them slower.
      - name: Start the simulator warming up
        id: simulator
        uses: ./.github/actions/simulator

      - name: Generate Xcode project
        run: xcodegen generate

      # The destination is generic on purpose. Naming the device makes xcodebuild
      # ask CoreSimulator about it before it will plan anything, and a simulator
      # that is halfway through booting takes minutes to answer — so the build
      # would sit and wait for the very thing it is supposed to be running
      # alongside. `ARCHS` keeps a generic destination from compiling every
      # architecture the simulator platform has.
      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            ARCHS="$(uname -m)" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: Wait for the simulator
        uses: ./.github/actions/simulator
        with:
          wait: warm

      - name: Capture screenshots
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p screenshots

          BUNDLE_ID="com.pigpen.app"

          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find built .app bundle"
            exit 1
          fi
          echo "Installing: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

          # Each screen is shot in both appearances off a single launch: the views
          # read the colour scheme out of the environment, so flipping the
          # simulator under a running app re-draws it, and the two shots then show
          # the same board rather than two rolls of the dice. `-map` and `-puzzle`
          # are launch arguments the app understands, so the world map and the
          # board can be captured without tapping through the title screen.
          capture() {
            local order="$1"
            local screen="$2"
            shift 2

            local light dark
            light=$(printf 'screenshots/%02d_%s_light.png' "$order" "$screen")
            dark=$(printf 'screenshots/%02d_%s_dark.png' "$((order + 1))" "$screen")

            xcrun simctl ui "$UDID" appearance light
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@"
            sleep 3
            xcrun simctl io "$UDID" screenshot "$light"

            xcrun simctl ui "$UDID" appearance dark
            sleep 2
            xcrun simctl io "$UDID" screenshot "$dark"

            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            echo "Captured: $light, $dark"
          }

          capture 1 title
          capture 3 map -map
          capture 5 puzzle -puzzle

          xcrun simctl status_bar "$UDID" clear

          echo "All screenshots captured:"
          ls -la screenshots/

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-pr-${{ github.event.pull_request.number }}
          path: screenshots/
          retention-days: 30

      - name: Post screenshots to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'ci-screenshots';
            const screenshotsDir = 'screenshots';

            // Ensure the ci-screenshots branch exists
            async function ensureBranch() {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch });
              } catch (e) {
                if (e.status === 404) {
                  const defaultBranch = await github.rest.repos.getBranch({
                    owner, repo, branch: 'main'
                  });
                  await github.rest.git.createRef({
                    owner, repo,
                    ref: `refs/heads/${branch}`,
                    sha: defaultBranch.data.commit.sha
                  });
                  core.info(`Created branch: ${branch}`);
                } else {
                  throw e;
                }
              }
            }

            async function uploadFile(filePath, targetPath) {
              const content = fs.readFileSync(filePath);
              const base64 = content.toString('base64');

              let sha;
              try {
                const existing = await github.rest.repos.getContent({
                  owner, repo, path: targetPath, ref: branch
                });
                sha = existing.data.sha;
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              const params = {
                owner, repo,
                path: targetPath,
                message: `Update screenshot for PR #${prNumber}`,
                content: base64,
                branch
              };
              if (sha) params.sha = sha;

              await github.rest.repos.createOrUpdateFileContents(params);
              const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${targetPath}`;
              return rawUrl;
            }

            await ensureBranch();

            const files = fs.readdirSync(screenshotsDir)
              .filter(f => f.endsWith('.png'))
              .sort();

            const images = [];
            for (const file of files) {
              const filePath = path.join(screenshotsDir, file);
              const targetPath = `pr-${prNumber}/${file}`;
              core.info(`Uploading ${file}...`);
              const url = await uploadFile(filePath, targetPath);
              images.push({ name: file, url });
            }

            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const cacheBust = Date.now();

            let body = `## 📱 App Screenshots\n\n`;
            body += `> Automatically captured from commit \`${commitSha}\` on **${context.payload.pull_request.head.ref}**\n\n`;

            // Screenshots are named <order>_<screen>_<appearance>.png, so each screen
            // gets its own light/dark row.
            const screens = [];
            const loose = [];
            for (const img of images) {
              const match = img.name.match(/^\d+_(.+)_(light|dark)\.png$/);
              if (!match) { loose.push(img); continue; }
              const [, name, appearance] = match;
              let screen = screens.find(s => s.name === name);
              if (!screen) { screen = { name }; screens.push(screen); }
              screen[appearance] = img.url;
            }

            const cell = (url) => url ? `<img src="${url}?v=${cacheBust}" width="300" />` : '—';

            for (const screen of screens) {
              const label = screen.name.replace(/_/g, ' ');
              body += `### ${label.charAt(0).toUpperCase()}${label.slice(1)}\n\n`;
              body += `| Light Mode | Dark Mode |\n`;
              body += `|:---:|:---:|\n`;
              body += `| ${cell(screen.light)} | ${cell(screen.dark)} |\n\n`;
            }

            for (const img of loose) {
              body += `### ${img.name.replace('.png', '').replace(/_/g, ' ')}\n`;
              body += `<img src="${img.url}?v=${cacheBust}" width="350" />\n\n`;
            }

            body += `\n<sub>📦 Full-resolution screenshots available in the <a href="${context.payload.pull_request.html_url}/checks">workflow artifacts</a>.</sub>\n`;
            body += `\n<!-- pr-screenshots-bot -->`;

            // Find existing bot comment to update, or create a new one
            const watermark = '<!-- pr-screenshots-bot -->';
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });

            const existing = comments.data.find(c => c.body && c.body.includes(watermark));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated existing comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body
              });
              core.info('Created new PR comment with screenshots');
            }
