name: App Store Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Submit to App Store
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Pigpen.xcodeproj \
            -scheme Pigpen

      - name: Set up App Store Connect API key
        env:
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ./private_keys
          echo "$API_KEY_CONTENT" > ./private_keys/AuthKey_${API_KEY_ID}.p8
          echo "API_KEY_PATH=$(pwd)/private_keys/AuthKey_${API_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Set up code signing
        id: signing
        uses: ./.github/actions/setup-signing
        with:
          certificate-p12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          certificate-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          provisioning-profile: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Pigpen.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile-name }}" \
            MARKETING_VERSION=${{ env.VERSION }} \
            CURRENT_PROJECT_VERSION=${{ env.BUILD_NUMBER }}

      - name: Configure export options
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
        run: |
          /usr/libexec/PlistBuddy \
            -c "Add :teamID string $TEAM_ID" \
            -c "Add :provisioningProfiles:com.pigpen.app string $PROFILE_NAME" \
            ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Pigpen.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file $RUNNER_TEMP/export/Pigpen.ipa \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_KEY_ISSUER"

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf ./private_keys
          security delete-keychain "${{ steps.signing.outputs.keychain-path }}" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/code-signing"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.VERSION }}"
          body: |
            ## Pigpen v${{ env.VERSION }}

            Build ${{ env.BUILD_NUMBER }} submitted to App Store Connect.
          draft: false
          prerelease: false
