name: PR Screenshots (languages)

# The gallery the other workflow posts is the game in English. This one is the
# same game beside it in every language it is translated into — Russian, to start
# with — and it runs when the words change rather than on every pull request: a
# branch that moves a button by three points does not need more pictures on it,
# and a branch that rewrites a sentence does.
#
# What it is looking for is not whether the translation is right — a person reads
# that in the catalog — but whether it fits. Russian runs long, and its words are
# long: a button gives way to it before it gives way to English, and that does not
# show up in a diff.
on:
  pull_request:
    branches: [main]
    paths:
      - 'Pigpen/Resources/Localizable.xcstrings'
      - '.github/workflows/screenshots-languages.yml'
  # The same hand crank the English gallery has, for a run that never arrived.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to post the screenshots to
        required: true

concurrency:
  group: screenshots-languages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Capture App Screenshots (languages)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            ARCHS="$(uname -m)" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: Wake up the iPhone simulator
        id: simulator
        uses: ./.github/actions/simulator

      - name: Capture every language
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p screenshots

          BUNDLE_ID="com.pigpen.app"

          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find built .app bundle"
            exit 1
          fi
          xcrun simctl install "$UDID" "$APP_PATH"

          # A screen caught mid-paint is a white room, and a white room weighs
          # nothing. The same weighing the English gallery does.
          shoot() {
            local into="$1"
            local attempt
            for attempt in 1 2 3; do
              xcrun simctl io "$UDID" screenshot "$into"
              if [ "$(stat -f%z "$into" 2>/dev/null || echo 0)" -ge 400000 ]; then
                return 0
              fi
              echo "Shot $into came back empty on attempt $attempt; giving it longer."
              sleep 4
            done
            echo "::warning::$into still looks blank after three attempts."
          }

          # `-AppleLanguages` and `-AppleLocale` handed to the app on launch are what
          # every screenshot tool uses to photograph a build in a language the runner
          # is not set to. The language picks the catalog's entries; the locale picks
          # how a number is written, which is a separate question and one this branch
          # has already been caught by once.
          capture() {
            local order="$1"
            local screen="$2"
            local code="$3"
            local locale="$4"
            shift 4

            local into
            into=$(printf 'screenshots/%02d_%s_%s.png' "$order" "$screen" "${code/-/_}")

            xcrun simctl launch "$UDID" "$BUNDLE_ID" \
              -AppleLanguages "($code)" -AppleLocale "$locale" "$@"
            sleep 6
            shoot "$into"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            echo "Captured: $into"
          }

          xcrun simctl ui "$UDID" appearance light

          # Light mode only. Dark doubles the gallery and tells you nothing about a
          # translation that light does not.
          #
          # Five screens, chosen for how much text they carry rather than how they
          # look: the title screen's rows, the settings sheet (the most prose in the
          # game), a boss board (the longest single sentence, and the one composed
          # around an animal's name), the toll card (a sentence built from a spelled
          # number), and the record card (the plural caption and the percentages).
          shoot_language() {
            local code="$1"
            local locale="$2"
            capture 1 title "$code" "$locale" -title-fresh
            capture 2 settings "$code" "$locale" -settings
            capture 3 boss "$code" "$locale" -boss
            capture 4 toll "$code" "$locale" -toll
            capture 5 record "$code" "$locale" -record
          }

          shoot_language en en_US
          shoot_language ru ru_RU

          xcrun simctl status_bar "$UDID" clear
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

          echo "Captured:"
          ls -la screenshots/

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-languages-pr-${{ github.event.pull_request.number || inputs.pr }}
          path: screenshots/
          retention-days: 30

      - name: Post screenshots to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = context.payload.pull_request?.number
              ?? Number(context.payload.inputs.pr);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'ci-screenshots';
            const screenshotsDir = 'screenshots';

            // The languages in the order the gallery reads them, English first as the
            // one the others are being compared against.
            const LANGUAGES = [
              ['en', 'English'],
              ['ru', 'Russian'],
            ];

            async function ensureBranch() {
              try {
                await github.rest.repos.getBranch({ owner, repo, branch });
              } catch (e) {
                if (e.status === 404) {
                  const main = await github.rest.repos.getBranch({
                    owner, repo, branch: 'main'
                  });
                  await github.rest.git.createRef({
                    owner, repo,
                    ref: `refs/heads/${branch}`,
                    sha: main.data.commit.sha
                  });
                } else {
                  throw e;
                }
              }
            }

            async function inParallel(items, limit, worker) {
              const results = new Array(items.length);
              let next = 0;
              await Promise.all(
                Array.from({ length: Math.min(limit, items.length) }, async () => {
                  while (next < items.length) {
                    const i = next++;
                    results[i] = await worker(items[i], i);
                  }
                })
              );
              return results;
            }

            await ensureBranch();

            const files = fs.readdirSync(screenshotsDir)
              .filter(f => f.endsWith('.png'))
              .sort();

            const blobs = await inParallel(files, 8, async (file) => {
              const content = fs.readFileSync(path.join(screenshotsDir, file));
              const { data } = await github.rest.git.createBlob({
                owner, repo,
                content: content.toString('base64'),
                encoding: 'base64'
              });
              return {
                path: `pr-${prNumber}/languages/${file}`,
                mode: '100644',
                type: 'blob',
                sha: data.sha
              };
            });

            async function commitShots() {
              const ref = await github.rest.git.getRef({
                owner, repo, ref: `heads/${branch}`
              });
              const parent = ref.data.object.sha;
              const parentCommit = await github.rest.git.getCommit({
                owner, repo, commit_sha: parent
              });
              const tree = await github.rest.git.createTree({
                owner, repo,
                base_tree: parentCommit.data.tree.sha,
                tree: blobs
              });
              const commit = await github.rest.git.createCommit({
                owner, repo,
                message: `Update language screenshots for PR #${prNumber}`,
                tree: tree.data.sha,
                parents: [parent]
              });
              await github.rest.git.updateRef({
                owner, repo,
                ref: `heads/${branch}`,
                sha: commit.data.sha
              });
            }

            for (let attempt = 1; ; attempt++) {
              try {
                await commitShots();
                break;
              } catch (e) {
                if (e.status !== 422 || attempt === 5) throw e;
              }
            }

            const cacheBust = Date.now();
            const url = (file) =>
              `https://raw.githubusercontent.com/${owner}/${repo}/${branch}` +
              `/pr-${prNumber}/languages/${file}?v=${cacheBust}`;

            // <order>_<screen>_<language>.png, gathered screen by screen so the same
            // screen in every language sits in one row and an overflowing button
            // shows up against the English that did not overflow.
            const screens = new Map();
            for (const file of files) {
              const parts = file.match(/^\d+_(.+)_([a-z]{2}(?:_[A-Z]{2})?)\.png$/);
              if (!parts) continue;
              const [, screen, code] = parts;
              if (!screens.has(screen)) screens.set(screen, new Map());
              screens.get(screen).set(code, file);
            }

            const pr = context.payload.pull_request
              ?? (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;

            let body = `## 🌍 App Screenshots, every language\n\n`;
            body += `> Automatically captured from commit \`${pr.head.sha.substring(0, 7)}\``;
            body += ` on **${pr.head.ref}**, light mode only.\n`;
            body += `> Posted because this branch changes \`Localizable.xcstrings\`.`;
            body += ` What to look for is fit rather than wording — a button that has given`;
            body += ` way, a line that has been cut off, a font that has not loaded.\n\n`;

            // Never more than four across: a GitHub comment is about eight hundred
            // points wide, and more phones than that in a row are each too small to
            // see a truncated button in.
            const inFours = (items) => {
              const rows = [];
              for (let at = 0; at < items.length; at += 4) rows.push(items.slice(at, at + 4));
              return rows;
            };

            for (const [screen, byLanguage] of screens) {
              const label = screen.charAt(0).toUpperCase() + screen.slice(1);
              body += `### ${label}\n\n`;
              const shown = LANGUAGES.filter(([code]) => byLanguage.has(code));
              for (const row of inFours(shown)) {
                body += `| ${row.map(([, name]) => name).join(' | ')} |\n`;
                body += `|${row.map(() => ':---:').join('|')}|\n`;
                body += `| ${row
                  .map(([code]) => `<img src="${url(byLanguage.get(code))}" width="220" />`)
                  .join(' | ')} |\n\n`;
              }
            }

            body += `\n<sub>📦 Full-resolution screenshots in the`;
            body += ` <a href="${pr.html_url}/checks">workflow artifacts</a>.</sub>\n`;
            body += `\n<!-- pr-screenshots-languages-bot -->`;

            const watermark = '<!-- pr-screenshots-languages-bot -->';
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const existing = comments.data.find(c => c.body && c.body.includes(watermark));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body
              });
            }
