name: App Store Assets

# The PR screenshots are shot on whatever iPhone the runner has and posted for a
# reviewer to glance at — the wrong sizes for the store, and unframed. This is the
# other job: it shoots a chosen few screens on the exact simulators App Review asks
# for — iPhone 6.9 inch and iPad 13 inch — and frames each with a line of copy, then
# records the app playing a board by itself for the preview video on each, so what
# comes out of it uploads straight to App Store Connect. On the phone it also records
# the spot: the nine-second commercial the app plays itself, cut for a feed with the
# game's own noises and tune under it.
#
# Every language the game is translated into gets its own set, shot with the app
# launched in that language and framed with captions written in it — the listing
# carries screenshots and a preview per localization. Each language is a job of its
# own, run side by side, with its own artifact: appstore-assets-en, appstore-assets-ru.
#
# It is hand-cranked rather than run on every push: store assets are wanted at a
# release, not a commit. Run it from the Actions tab; the framed and raw shots and the
# preview videos come back as a downloadable artifact per language.

on:
  workflow_dispatch:
    inputs:
      appearance:
        description: Light or dark screens
        required: false
        default: light
        type: choice
        options: [light, dark]
      language:
        description: Which language's set to make
        required: false
        default: all
        type: choice
        options: [all, en, ru]

concurrency:
  group: appstore-assets-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  assets:
    name: Capture App Store Assets (${{ matrix.language }})
    runs-on: macos-26
    strategy:
      # One language failing is no reason to throw away the other's run.
      fail-fast: false
      matrix:
        # Every language in the app's `knownRegions`, or the one asked for.
        language: ${{ fromJSON((github.event.inputs.language || 'all') == 'all' && '["en","ru"]' || format('["{0}"]', github.event.inputs.language)) }}
    # Two devices' worth of screens, a retake for any that come out blank, a
    # 35-second recording on each and a 20-second one more on the phone: a slow runner
    # has taken 38 minutes to get through the capture alone.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Pillow
        run: python3 -m pip install --quiet --break-system-packages Pillow

      # The preview video comes off the simulator as a variable-rate recording at the
      # screen's own size, and App Store Connect wants a fixed 30 fps at its own sizes
      # with an audio track in it — which is ffmpeg's job.
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            ARCHS="$(uname -m)" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: Capture and frame
        env:
          APPEARANCE: ${{ github.event.inputs.appearance || 'light' }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail

          BUNDLE_ID="com.pigpen.app"
          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then echo "ERROR: no .app built"; exit 1; fi

          # The seven screens the store leads with, each with the line of copy it
          # carries. Kept here, in the order they sit on the listing today — which is
          # the source of truth, so a change there is copied back here — so the story a
          # browser reads is set in one place: a city board part way through, the peak's
          # best pen, the moment the meadow opens, a boss, the whole map, the daily, and
          # the tundra's best pen to finish. Each language has the same seven, in the same
          # order, with its own captions — the Russian in the voice of the game's own
          # catalog: «ты», Pig by name, a pen a «загон», a board a «головоломка».
          case "$LANGUAGE" in
            en)
              LOCALE=en_US
              SCREENS=(
                "clocktower:-pies:Fence the biggest pen you can"
                "smoulder:-embers:Twelve worlds, twelve grounds"
                "gate:-opening-gate:Then someone left the gate open"
                "stag:-boss:Bosses want two pens at once"
                "universe:-universe:A whole universe to solve"
                "daily:-archive:One new puzzle every morning"
                "floe:-floe:Every board has one right answer"
              ) ;;
            ru)
              LOCALE=ru_RU
              SCREENS=(
                "clocktower:-pies:Построй загон как можно больше"
                "smoulder:-embers:Двенадцать миров, двенадцать ландшафтов"
                "gate:-opening-gate:А потом кто-то оставил калитку открытой"
                "stag:-boss:Боссам нужны два загона сразу"
                "universe:-universe:Целая вселенная головоломок"
                "daily:-archive:Каждое утро — новая головоломка"
                "floe:-floe:У каждой головоломки один верный ответ"
              ) ;;
            *) echo "ERROR: no captions for language '$LANGUAGE'"; exit 1 ;;
          esac
          # How every screenshot tool photographs a build in a language the runner is
          # not set to: the language picks the catalog's entries, the locale how dates
          # and numbers are written. The same pair the language gallery launches with.
          LANG_ARGS=(-AppleLanguages "($LANGUAGE)" -AppleLocale "$LOCALE")

          # Pick the first simulator on offer whose name matches one we want, and
          # make it if the runner has the device type but has not built one yet.
          pick() {
            local kind="$1"; shift
            local available; available=$(xcrun simctl list devices available)
            local udid=""
            for name in "$@"; do
              udid=$(grep -m1 "^ *$name (" <<< "$available" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)
              [ -n "$udid" ] && { echo "$udid"; return; }
            done
            # None booted yet — create the first named type against the newest runtime.
            local runtime; runtime=$(xcrun simctl list runtimes | grep -E 'iOS' | tail -1 | sed -E 's/.*(com\.apple[^ ]*).*/\1/')
            for name in "$@"; do
              udid=$(xcrun simctl create "$name" "$name" "$runtime" 2>/dev/null || true)
              [ -n "$udid" ] && { echo "$udid"; return; }
            done
            echo "ERROR: no $kind simulator available" >&2
            echo "$available" >&2
            return 1
          }

          # The status bar the listing wears: 9:41, full wifi and a full battery with no
          # charging bolt on it, and no cellular — the simulator has no carrier to show.
          # (An iPad prints the date beside the clock, and that stays the runner's.)
          dress_status_bar() {
            xcrun simctl status_bar "$1" override --time "9:41" \
              --batteryState discharging --batteryLevel 100 \
              --wifiMode active --wifiBars 3 --cellularMode notSupported 2>/dev/null || true
          }

          # Whether a screenshot came out a single flat colour — the app caught before it
          # had drawn anything, which a slow launch on the iPad does now and then. Only the
          # middle of the shot is looked at, since the status bar is drawn either way.
          blank() {
            python3 -c "import sys; from PIL import Image; i = Image.open(sys.argv[1]).convert('L'); w, h = i.size; lo, hi = i.crop((w // 5, h // 5, w * 4 // 5, h * 4 // 5)).getextrema(); sys.exit(0 if hi - lo < 8 else 1)" "$1"
          }

          shoot() {
            local label="$1" udid="$2"
            mkdir -p "out/$label/raw" "out/$label/framed"
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" appearance "$APPEARANCE"
            dress_status_bar "$udid"
            xcrun simctl install "$udid" "$APP_PATH"

            local order=1
            for entry in "${SCREENS[@]}"; do
              local slug="${entry%%:*}"; local rest="${entry#*:}"
              local arg="${rest%%:*}"; local caption="${rest#*:}"
              local raw="out/$label/raw/${slug}.png"
              # Three goes at it, each given longer to draw, before a blank shot is let
              # through to fail the run below rather than land on the listing.
              for wait in 3 6 10; do
                xcrun simctl launch "$udid" "$BUNDLE_ID" "${LANG_ARGS[@]}" "$arg"
                sleep "$wait"
                xcrun simctl io "$udid" screenshot "$raw"
                xcrun simctl terminate "$udid" "$BUNDLE_ID" 2>/dev/null || true
                blank "$raw" || break
                echo "WARNING: $label $slug came out blank after ${wait}s; shooting it again"
              done
              if blank "$raw"; then echo "ERROR: $label $slug is still blank"; exit 1; fi
              python3 Tools/appstore_frames.py \
                --input "$raw" \
                --output "$(printf 'out/%s/framed/%02d_%s.png' "$label" "$order" "$slug")" \
                --caption "$caption"
              order=$((order + 1))
            done
            echo "== $label ($LANGUAGE, $APPEARANCE) =="
            ls -la "out/$label/framed" || true
          }

          # Both films are recorded rather than rendered, since Apple takes a preview
          # only as a recording of the app and the spot is made the same way for the same
          # reason: what it shows is what the app does. `roll` is the camera. It starts
          # the recorder before the launch, since it can take seconds to get going,
          # launches the app on the argument that opens the film, and stops the recorder
          # well after the film ends. The recorder says "Recording started" the moment
          # its first frame is taken, and a reel prints its own mark the moment its film
          # starts; both are stamped on this Mac's clock, and the cut is the gap between
          # them, left in INTO. (Not measured back from the stop: the recorder only
          # writes a frame when the screen changes, so a still ending leaves the file
          # shorter than the wait.)
          roll() {
            local dir="$1" udid="$2" argument="$3" mark="$4" seconds="$5"
            mkdir -p "$dir"
            xcrun simctl terminate "$udid" "$BUNDLE_ID" 2>/dev/null || true
            # Every line the recorder says, stamped with the time it said it.
            xcrun simctl io "$udid" recordVideo --codec=h264 --force "$dir/raw.mov" \
              > >(python3 -u -c 'import sys, time
          for line in sys.stdin: print(time.time(), line, end="", flush=True)' > "$dir/recorder.log") 2>&1 &
            local recorder=$!
            sleep 3
            xcrun simctl launch --stdout="$dir/app.log" "$udid" "$BUNDLE_ID" "${LANG_ARGS[@]}" "$argument"
            sleep "$seconds"
            kill -INT "$recorder"
            wait "$recorder" || true
            xcrun simctl terminate "$udid" "$BUNDLE_ID" 2>/dev/null || true

            local started; started=$(awk -v mark="$mark" '$1 == mark { print $2; exit }' "$dir/app.log" || true)
            if [ -z "$started" ]; then
              echo "ERROR: the reel never said when its film started"; cat "$dir/app.log" || true; exit 1
            fi
            local recording; recording=$(awk '/Recording started/ { print $1; exit }' "$dir/recorder.log" || true)
            if [ -z "$recording" ]; then
              echo "ERROR: the recorder never said it had started"; cat "$dir/recorder.log" || true; exit 1
            fi
            INTO=$(python3 -c "print(round($started - $recording, 3))")
          }

          # The preview video. `-preview` opens PreviewReel.swift: the live listing's
          # twenty-second film, played by the app on a fixed clock after four seconds held
          # still on its first board. ffmpeg brings the cut to the store's size for the
          # device, a steady 30 fps (holding the last frame if the still ending left the
          # file short), and a silent stereo track, which App Store Connect asks for.
          record() {
            local label="$1" udid="$2" size="$3"
            local dir="$PWD/out/$label/preview"
            roll "$dir" "$udid" -preview PREVIEW_REEL_START 32
            echo "$label: the film starts ${INTO}s into the recording"

            ffmpeg -hide_banner -loglevel error -y \
              -ss "$INTO" -i "$dir/raw.mov" \
              -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
              -map 0:v:0 -map 1:a:0 -t 20 -shortest \
              -vf "scale=${size/x/:}:flags=lanczos,setsar=1,fps=30,tpad=stop_mode=clone:stop_duration=20" \
              -c:v libx264 -profile:v high -level 4.0 -pix_fmt yuv420p \
              -b:v 10M -maxrate 12M -bufsize 20M \
              -c:a aac -b:a 256k -ar 44100 -ac 2 \
              -movflags +faststart \
              "$dir/preview.mp4"
            echo "== $label preview =="
            ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,avg_frame_rate \
              -of compact "$dir/preview.mp4"
          }

          # The spot. `-spot` opens SpotReel.swift: the nine-second commercial — the pig
          # out through a gap, the gap shut, the lap of honour, the name — played by the
          # app on a fixed clock after the same four seconds held still. It is cut for a
          # feed rather than the store: 1080 by 1920, the phone's own picture stood in the
          # middle of a blurred copy of itself where a phone's screen is narrower than
          # nine by sixteen. The simulator records no sound, so the soundtrack is built
          # here from what the reel wrote down — one SPOT_REEL_SOUND line per noise the
          # game made, naming the file and the second of the film it was asked for — laid
          # in at those moments over the game's own tune at about a third of their level,
          # which is how the app itself mixes them. A noise from before the film started
          # has a negative time and is left out.
          spot() {
            local label="$1" udid="$2"
            local dir="$PWD/out/$label/spot"
            roll "$dir" "$udid" -spot SPOT_REEL_START 20
            echo "$label: the spot starts ${INTO}s into the recording"

            local inputs=(-ss "$INTO" -i "$dir/raw.mov" -i Pigpen/Resources/Music/meadow-waltz.wav)
            local voice="aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo"
            local filter="[1:a]${voice},volume=0.35,afade=t=out:st=8:d=1[music]"
            local mix="[music]" count=1 next=2
            while read -r name at; do
              if [ ! -f "Pigpen/Resources/Sounds/$name.wav" ]; then
                echo "WARNING: the reel named a sound there is no file for: $name"; continue
              fi
              local ms; ms=$(python3 -c "print(round($at * 1000))")
              inputs+=(-i "Pigpen/Resources/Sounds/$name.wav")
              filter+=";[$next:a]${voice},adelay=${ms}|${ms}[noise$next]"
              mix+="[noise$next]"
              count=$((count + 1)); next=$((next + 1))
            done < <(awk '$1 == "SPOT_REEL_SOUND" && $3 >= 0 { print $2, $3 }' "$dir/app.log")
            echo "$label: $((count - 1)) noises under the spot"
            filter+=";${mix}amix=inputs=${count}:normalize=0[audio]"
            filter+=";[0:v]split=2[back][front]"
            filter+=";[back]scale=1080:1920:flags=lanczos,boxblur=luma_radius=30:luma_power=2,setsar=1[blur]"
            filter+=";[front]scale=-2:1920:flags=lanczos,setsar=1[phone]"
            filter+=";[blur][phone]overlay=(W-w)/2:(H-h)/2,fps=30,tpad=stop_mode=clone:stop_duration=9[video]"

            ffmpeg -hide_banner -loglevel error -y \
              "${inputs[@]}" \
              -filter_complex "$filter" \
              -map "[video]" -map "[audio]" -t 9 \
              -c:v libx264 -profile:v high -level 4.0 -pix_fmt yuv420p \
              -b:v 10M -maxrate 12M -bufsize 20M \
              -c:a aac -b:a 256k -ar 44100 -ac 2 \
              -movflags +faststart \
              "$dir/spot.mp4"
            echo "== $label spot =="
            ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,avg_frame_rate \
              -of compact "$dir/spot.mp4"
          }

          IPHONE=$(pick "iPhone 6.9-inch" "iPhone 16 Pro Max" "iPhone 17 Pro Max" "iPhone 15 Pro Max")
          IPAD=$(pick "iPad 13-inch" "iPad Pro 13-inch (M4)" "iPad Pro (12.9-inch) (6th generation)" "iPad Pro (12.9-inch) (5th generation)")

          shoot iphone_6_9 "$IPHONE"
          record iphone_6_9 "$IPHONE" 886x1920
          spot iphone_6_9 "$IPHONE"
          shoot ipad_13 "$IPAD"
          record ipad_13 "$IPAD" 1200x1600

          echo "Sizes captured:"
          python3 -c "import glob; from PIL import Image; [print(p, Image.open(p).size) for p in sorted(glob.glob('out/*/framed/*.png'))]"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: appstore-assets-${{ matrix.language }}
          path: out/
          if-no-files-found: error
