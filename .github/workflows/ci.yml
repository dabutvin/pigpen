name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      # Waking the simulator is the longest thing this job does and it needs
      # nothing from the build, so it starts here and runs alongside everything
      # below rather than after it. Homebrew goes first only because a download
      # racing the boot for the machine makes both of them slower.
      - name: Start the simulator warming up
        id: simulator
        uses: ./.github/actions/simulator
        with:
          display: 'false'

      - name: Generate Xcode project
        run: xcodegen generate

      # `build-for-testing` builds the app and the test bundle once, and the test
      # step below runs them without building anything again.
      #
      # The destination is generic on purpose. Naming the device makes xcodebuild
      # ask CoreSimulator about it before it will plan anything, and a simulator
      # that is halfway through booting takes minutes to answer — so the build
      # would sit and wait for the very thing it is supposed to be running
      # alongside. `ARCHS` keeps a generic destination from compiling every
      # architecture the simulator platform has.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            ARCHS="$(uname -m)" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: Wait for the simulator
        uses: ./.github/actions/simulator
        with:
          wait: installed
          display: 'false'

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            2>&1 | tee test.log
          if grep -q "TEST FAILED\|BUILD FAILED" test.log; then exit 1; fi
