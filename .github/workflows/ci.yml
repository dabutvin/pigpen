name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Pigpen.xcodeproj \
            -scheme Pigpen

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: Pick simulator
        run: |
          set -euo pipefail
          AVAILABLE=$(xcrun simctl list devices available)
          DEVICE=""
          for name in "iPhone 17 Pro" "iPhone 17" "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15"; do
            if grep -q "^ *$name (" <<< "$AVAILABLE"; then DEVICE="$name"; break; fi
          done
          if [ -z "$DEVICE" ]; then
            DEVICE=$(grep -oE '^ *iPhone[^(]*' <<< "$AVAILABLE" | head -1 | xargs || true)
          fi
          if [ -z "$DEVICE" ]; then
            echo "ERROR: No iPhone simulator available"
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "DEVICE=$DEVICE" >> $GITHUB_ENV

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "platform=iOS Simulator,name=${{ env.DEVICE }},OS=latest" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log
          if grep -q "TEST FAILED\|BUILD FAILED" test.log; then exit 1; fi
