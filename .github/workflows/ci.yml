name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      # Starting the simulator is the longest thing this job does and it needs
      # nothing from the build, so it goes first and runs alongside everything
      # below rather than after it.
      - name: Start the simulator warming up
        id: simulator
        uses: ./.github/actions/simulator
        with:
          display: 'false'

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # `build-for-testing` builds the app and the test bundle once, for the
      # simulator the tests will run on. Building for a generic destination first
      # would compile every architecture the simulator platform has and then get
      # thrown away by the test build.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: Wait for the simulator
        uses: ./.github/actions/simulator
        with:
          wait: installed
          display: 'false'

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Pigpen.xcodeproj \
            -scheme Pigpen \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            2>&1 | tee test.log
          if grep -q "TEST FAILED\|BUILD FAILED" test.log; then exit 1; fi
