name: Set up code signing
description: >
  Import the App Store distribution certificate and provisioning profile from secrets
  into a throwaway keychain, so every run signs with the same long-lived identity
  instead of asking Apple to issue a new certificate.

inputs:
  certificate-p12:
    description: Base64-encoded Apple Distribution certificate and private key (.p12)
    required: true
  certificate-password:
    description: Password the .p12 was exported with
    required: true
  provisioning-profile:
    description: Base64-encoded App Store provisioning profile (.mobileprovision)
    required: true
  bundle-identifier:
    description: Bundle ID the profile is expected to cover
    required: false
    default: com.pigpen.app

outputs:
  profile-name:
    description: Installed profile's name, for PROVISIONING_PROFILE_SPECIFIER
    value: ${{ steps.import.outputs.profile-name }}
  keychain-path:
    description: Temporary keychain to delete once the build is done
    value: ${{ steps.import.outputs.keychain-path }}

runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        CERT_P12: ${{ inputs.certificate-p12 }}
        CERT_PASSWORD: ${{ inputs.certificate-password }}
        PROFILE_B64: ${{ inputs.provisioning-profile }}
        BUNDLE_ID: ${{ inputs.bundle-identifier }}
      run: |
        set -euo pipefail

        MISSING=""
        [ -n "$CERT_P12" ] || MISSING="$MISSING APPLE_DISTRIBUTION_CERT_P12"
        [ -n "$CERT_PASSWORD" ] || MISSING="$MISSING APPLE_DISTRIBUTION_CERT_PASSWORD"
        [ -n "$PROFILE_B64" ] || MISSING="$MISSING APPLE_PROVISIONING_PROFILE"
        if [ -n "$MISSING" ]; then
          echo "::error::Missing signing secrets:$MISSING. Run Tools/prepare_signing_secrets.sh, then see \"Required Secrets\" in README.md."
          exit 1
        fi

        WORK="$RUNNER_TEMP/code-signing"
        mkdir -p "$WORK"
        KEYCHAIN="$WORK/signing.keychain-db"
        KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

        echo "$CERT_P12" | base64 --decode > "$WORK/certificate.p12"
        echo "$PROFILE_B64" | base64 --decode > "$WORK/profile.mobileprovision"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 3600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$WORK/certificate.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
          -f pkcs12 -t cert -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$WORK/certificate.p12"

        # Without a partition list, codesign blocks on a GUI prompt for the private key.
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

        # xcodebuild only looks at keychains in the user search list, so prepend ours.
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Distribution" || true)
        if [ "$IDENTITY" -eq 0 ]; then
          echo "::error::The imported certificate has no valid Apple Distribution identity. It may be expired, revoked, or a development certificate."
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          exit 1
        fi

        security cms -D -i "$WORK/profile.mobileprovision" > "$WORK/profile.plist"
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$WORK/profile.plist")
        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$WORK/profile.plist")
        PROFILE_EXPIRY=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$WORK/profile.plist")
        PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$WORK/profile.plist")

        case "$PROFILE_APP_ID" in
          *".$BUNDLE_ID"|*".*") ;;
          *) echo "::warning::Profile '$PROFILE_NAME' covers $PROFILE_APP_ID, which does not match $BUNDLE_ID." ;;
        esac

        # Xcode 16 moved the profile directory; write to both so either location works.
        for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                   "$HOME/Library/MobileDevice/Provisioning Profiles"; do
          mkdir -p "$DIR"
          cp "$WORK/profile.mobileprovision" "$DIR/$PROFILE_UUID.mobileprovision"
        done

        echo "profile-name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
        echo "keychain-path=$KEYCHAIN" >> "$GITHUB_OUTPUT"

        echo "Signing with the certificate from secrets (no new certificate requested)."
        echo "Profile: $PROFILE_NAME ($PROFILE_UUID), expires $PROFILE_EXPIRY"
