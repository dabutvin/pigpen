name: Wake up an iPhone simulator
description: >
  Pick an iPhone simulator and get it to the point where it can install, run and
  photograph an app. A simulator that has never been booted on a fresh runner
  spends five or six minutes getting there, and almost none of that is the app's
  doing: it is installd starting up, the runtime's shared cache being built the
  first time anything launches, and a display being attached the first time
  anything is photographed. Handing all of that to a stub app leaves the real one
  arriving to a simulator that has done it once already.

inputs:
  display:
    description: >
      Whether the simulator is going to be photographed. Sets the status bar to
      the usual 9:41 with everything full, and exercises the appearance switch
      and the display grab. Jobs that only run tests can leave this off.
    required: false
    default: 'true'
  count:
    description: >
      How many simulators to ready. Anything past the first is a clone of it, so
      every device is the same model and shots off any of them are the same size.
      Work that is a queue of independent launches — photographing one screen
      after another — can be dealt round several devices and finish in a
      fraction of the time, and the second device is cheap because the runtime's
      shared cache is built once and shared. Extras are best effort: whatever
      does not come up is simply left out of `udids`.
    required: false
    default: '1'

outputs:
  udid:
    description: Identifier of the first simulator, for `-destination "id=..."`
    value: ${{ steps.pick.outputs.udid }}
  udids:
    description: Identifiers of every simulator that came up, space separated
    value: ${{ steps.warm.outputs.udids }}
  device:
    description: Name of the chosen simulator, for the logs
    value: ${{ steps.pick.outputs.device }}

runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      run: |
        set -euo pipefail

        AVAILABLE=$(xcrun simctl list devices available)
        LINE=""
        for NAME in "iPhone 17 Pro" "iPhone 17" "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15"; do
          LINE=$(grep -m1 "^ *$NAME (" <<< "$AVAILABLE" || true)
          [ -n "$LINE" ] && break
        done
        if [ -z "$LINE" ]; then
          LINE=$(grep -m1 -E "^ *iPhone .*\([0-9A-Fa-f-]{36}\)" <<< "$AVAILABLE" || true)
        fi
        if [ -z "$LINE" ]; then
          echo "ERROR: No iPhone simulator available"
          echo "$AVAILABLE"
          exit 1
        fi

        DEVICE=$(sed -E 's/^ *(.*) \(([0-9A-Fa-f-]{36})\).*/\1/' <<< "$LINE")
        UDID=$(sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' <<< "$LINE")
        echo "Chose simulator: $DEVICE ($UDID)"

        # Cloning is only allowed while the source is shut down, which on a fresh
        # runner it is, so the extras have to be made before anything is booted.
        UDIDS="$UDID"
        for ((i = 2; i <= ${{ inputs.count }}; i++)); do
          CLONE=$(xcrun simctl clone "$UDID" "$DEVICE $i" 2>/dev/null || true)
          if [[ "$CLONE" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
            echo "Cloned a second $DEVICE ($CLONE)"
            UDIDS="$UDIDS $CLONE"
          else
            echo "Could not clone $DEVICE; carrying on with what there is"
          fi
        done

        echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"
        echo "picked=$UDIDS" >> "$GITHUB_OUTPUT"

    - id: warm
      shell: bash
      run: |
        set -uo pipefail

        # Every device warms at once. The expensive part of the first one — the
        # runtime's shared cache — is built once and shared, so the others cost
        # little more than their own boot.
        PIDS=()
        IDS=()
        for UDID in ${{ steps.pick.outputs.picked }}; do
          bash "${{ github.action_path }}/warm-up.sh" \
            "$UDID" \
            "${{ github.action_path }}/stub" \
            "$RUNNER_TEMP/simulator/$UDID" \
            "${{ inputs.display }}" &
          PIDS+=("$!")
          IDS+=("$UDID")
        done

        READY=()
        for i in "${!PIDS[@]}"; do
          if wait "${PIDS[$i]}"; then
            READY+=("${IDS[$i]}")
          else
            echo "${IDS[$i]} did not come up; leaving it out"
          fi
        done

        # The first device is the one every caller falls back on, so it is the
        # only one worth failing the job over.
        if [[ " ${READY[*]} " != *" ${{ steps.pick.outputs.udid }} "* ]]; then
          echo "ERROR: the simulator never came up"
          exit 1
        fi

        echo "Ready: ${READY[*]}"
        echo "udids=${READY[*]}" >> "$GITHUB_OUTPUT"
