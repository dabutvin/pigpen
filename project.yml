name: Pigpen
options:
  bundleIdPrefix: com.pigpen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.2"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: Pigpen/Resources/Info.plist
    # Where the counting is sent. Empty by default, and empty means the game counts
    # nothing and sends nothing — a fork, a checkout and a screenshot run all build and
    # play exactly as they did. The release workflow passes the real one in.
    TELEMETRYDECK_APP_ID: ""

targets:
  Pigpen:
    type: application
    platform: iOS
    sources:
      - Pigpen
    resources:
      - path: Pigpen/Resources/Assets.xcassets
      - path: Pigpen/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pigpen.app
        INFOPLIST_FILE: Pigpen/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pigpen/Resources/Pigpen.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - PigpenTests
      # Runs the app against the local StoreKit config rather than a real storefront, so a
      # simulator can fetch the price and buy the full game without an App Store account or a
      # sandbox tester. Only the scheme's run action reads it — an archive still talks to the
      # real store — so this is a development convenience and not a shipping switch.
      #
      # The leading `../` is not a mistake. XcodeGen writes this into the scheme relative to
      # the scheme's own folder, two levels down inside the generated project; naming the file
      # plainly lands the reference inside Pigpen.xcodeproj, where the file is not.
      storeKitConfiguration: ../Pigpen.storekit
    info:
      path: Pigpen/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pigpen
        CFBundleName: Pigpen
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TelemetryDeckAppID: "$(TELEMETRYDECK_APP_ID)"
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  PigpenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PigpenTests
    dependencies:
      - target: Pigpen
