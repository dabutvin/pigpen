name: Pigpen
options:
  bundleIdPrefix: com.pigpen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: Pigpen/Resources/Info.plist

targets:
  Pigpen:
    type: application
    platform: iOS
    sources:
      - Pigpen
    resources:
      - path: Pigpen/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pigpen.app
        INFOPLIST_FILE: Pigpen/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pigpen/Resources/Pigpen.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Pigpen/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pigpen
        CFBundleName: Pigpen
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  PigpenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PigpenTests
    dependencies:
      - target: Pigpen
